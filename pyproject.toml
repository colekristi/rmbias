[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colekristi-rmbias"
version = "0.1.0"
description = "统计奖励分与文本特征的相关性，给出偏置强度与方向"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "colekristi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://colekristi.github.io"
Repository = "https://github.com/colekristi/rmbias"
Issues = "https://github.com/colekristi/rmbias/issues"

[project.scripts]
rmbias = "rmbias:main"

[tool.setuptools]
py-modules = ["rmbias"]
